{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="{% static 'css/styles.css' %}">
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 24px;
        }

        div {
            width: 100%;
            max-width: 500px;
            background: #ffffff;
            border-radius: 24px;
            padding: 48px;
            box-shadow: 0 20px 45px rgba(15, 23, 42, 0.12);
        }

        h2 {
            color: #111827;
            font-size: 1.8rem;
            margin-bottom: 24px;
            text-align: center;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        form p {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin: 0;
        }

        form label {
            font-weight: 600;
            color: #374151;
            font-size: 0.95rem;
        }

        form input,
        form textarea,
        form select {
            padding: 10px 12px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-family: Arial, sans-serif;
            font-size: 1rem;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        form input:focus,
        form textarea:focus,
        form select:focus {
            outline: none;
            border-color: #4f46e5;
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
        }

        button {
            background: #4f46e5;
            color: white;
            padding: 12px 18px;
            border: none;
            border-radius: 999px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            font-size: 1rem;
            margin-top: 8px;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(79, 70, 229, 0.2);
        }

        .errorlist {
            list-style-type: none;
            padding: 12px;
            background-color: #fee2e2;
            color: #991b1b;
            border-left: 4px solid #dc2626;
            border-radius: 6px;
            margin: 0 0 16px 0;
            font-weight: 500;
        }

        .errorlist li {
            margin: 4px 0;
        }

        .message {
            background-color: #dcfce7;
            color: #166534;
            padding: 12px 16px;
            border-left: 4px solid #22c55e;
            border-radius: 6px;
            font-weight: 600;
            text-align: left;
            margin-bottom: 20px;
        }

        ul {
            margin: 0;
        }
    </style>
</head>
<body>
    <div>
        {% for message in messages %}
            <p class="message">The Message: {{message}}</p>
        {% endfor %}
        <h2>{{form_name}}</h2>
        <form action="" method="POST">
            {% csrf_token %}<br />
            {{ user_form.as_p }}
            {{form}}
            <button type="submit">Create Account</button>
        </form>
    </div>
</body>
</html>
