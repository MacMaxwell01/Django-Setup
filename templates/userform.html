<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap');

        body {
            font-family: 'Inter', system_ui, sans-serif;
        }

        .form-card {
            box-shadow: 0 25px 50px -12px rgb(0 0 0 / 0.15);
        }

        input:focus, textarea:focus {
            outline: none;
            border-color: #0f766e;
            box-shadow: 0 0 0 3px rgba(15, 118, 110, 0.2);
        }

        .error-input {
            border-color: #ef4444 !important;
        }

        .radio-label {
            transition: all 0.2s ease;
        }

        .radio-label:hover {
            background-color: #f1f5f9;
        }

        .radio-label.active {
            background-color: #ccfbf1;
            border-color: #14b8a6;
        }
    </style>
</head>
<body class="bg-emerald-50 min-h-screen flex items-center justify-center p-6">
    <div class="max-w-lg w-full">

        <form action="{% url 'submitform' %}" method="post" id="userForm" class="space-y-6">
            {% csrf_token %}
        <!-- Success Message -->
        <div id="successMessage" class="hidden mb-6 bg-zinc-800 text-white px-6 py-5 rounded-3xl flex items-start gap-4 shadow-xl">
            <div class="w-8 h-8 bg-emerald-500 rounded-2xl flex items-center justify-center flex-shrink-0">
                <i class="fa-solid fa-check text-xl"></i>
            </div>
            <div>
                <p class="font-semibold text-lg">Message Sent!</p>
                <p class="text-gray-300">Thanks for completing the form. We'll be in touch soon!</p>
            </div>
        </div>

        <div id="formContainer" class="bg-white rounded-3xl p-8 md:p-10 form-card">
            <h1 class="text-3xl font-bold text-zinc-900 mb-8">Sign Up</h1>

            <div id="contactForm" class="space-y-6">
                <!-- Name Fields -->
                <div class="grid grid-cols-2 gap-6">
                    <div>
                        <label class="block text-sm font-medium text-zinc-700 mb-1.5">First Name <span class="text-red-500">*</span></label>
                        <input id="firstName" name="firstname" type="text" 
                               class="w-full px-5 py-3 border border-zinc-300 rounded-2xl focus:border-teal-700 transition-colors"
                               placeholder="John">
                        <p id="firstNameError" class="text-red-500 text-xs mt-1.5 hidden">This field is required</p>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-zinc-700 mb-1.5">Last Name <span class="text-red-500">*</span></label>
                        <input id="lastName" name="lastname" type="text" 
                               class="w-full px-5 py-3 border border-zinc-300 rounded-2xl focus:border-teal-700 transition-colors"
                               placeholder="Appleseed">
                        <p id="lastNameError" class="text-red-500 text-xs mt-1.5 hidden">This field is required</p>
                    </div>
                </div>

                <!-- Email -->
                <div>
                    <label class="block text-sm font-medium text-zinc-700 mb-1.5">Email Address <span class="text-red-500">*</span></label>
                    <input id="email" name="email" type="email" 
                           class="w-full px-5 py-3 border border-zinc-300 rounded-2xl focus:border-teal-700 transition-colors"
                           placeholder="email@example.com">
                    <p id="emailError" class="text-red-500 text-xs mt-1.5 hidden">Please enter a valid email address</p>
                </div>

                <div>
                    <label class="block text-sm font-medium text-zinc-700 mb-1.5">Matric Number <span class="text-red-500">*</span></label>
                    <input id="matricNumber" name="matricnumber" type="text" 
                           class="w-full px-5 py-3 border border-zinc-300 rounded-2xl focus:border-teal-700 transition-colors"
                           placeholder="Matric Number">
                    <p id="matricNumberError" class="text-red-500 text-xs mt-1.5 hidden">This field is required</p>
                </div>

                <div>
                    <label class="block text-sm font-medium text-zinc-700 mb-1.5">Department <span class="text-red-500">*</span></label>
                    <input id="department" name="department" type="text" 
                           class="w-full px-5 py-3 border border-zinc-300 rounded-2xl focus:border-teal-700 transition-colors"
                           placeholder="Department">
                    <p id="departmentError" class="text-red-500 text-xs mt-1.5 hidden">This field is required</p>
                </div>

                <!-- Consent -->
                <div class="flex items-start gap-3">
                    <input type="checkbox" id="consent" class="w-5 h-5 mt-0.5 accent-teal-600">
                    <label for="consent" class="text-sm text-zinc-700 cursor-pointer">
                        I consent that all the information provided is accurate <span class="text-red-500">*</span>
                    </label>
                </div>
                <p id="consentError" class="text-red-500 text-xs -mt-2 hidden">To submit this form, please consent to the terms and conditions</p>

                <!-- Submit -->
                <button type="submit" 
                        class="w-full bg-teal-600 hover:bg-teal-700 active:scale-95 transition-all text-white font-semibold py-4 rounded-2xl text-lg">
                    Submit
                </button>
            </div>
        </form>
        </div>
    </div>

    <script>
        function validateForm() {
            let valid = true;
            // Reset previous errors
            document.querySelectorAll('[id$="Error"]').forEach(el => el.classList.add('hidden'));
            document.querySelectorAll('input, textarea').forEach(el => el.classList.remove('error-input'));

            // Validation logic (same as before)
            if (!document.getElementById('firstName').value.trim()) {
                document.getElementById('firstNameError').classList.remove('hidden');
                document.getElementById('firstName').classList.add('error-input');
                valid = false;
            }
            if (!document.getElementById('lastName').value.trim()) {
                document.getElementById('lastNameError').classList.remove('hidden');
                document.getElementById('lastName').classList.add('error-input');
                valid = false;
            }
            if (!document.getElementById('email').value.trim()) {
                document.getElementById('emailError').classList.remove('hidden');
                document.getElementById('email').classList.add('error-input');
                valid = false;
            }
            if (!document.getElementById('matricNumber').value.trim()) {
                document.getElementById('matricNumberError').classList.remove('hidden');
                document.getElementById('matricNumber').classList.add('error-input');
                valid = false;
            }
            if (!document.getElementById('department').value.trim()) {
                document.getElementById('departmentError').classList.remove('hidden');
                document.getElementById('department').classList.add('error-input');
                valid = false;
            }
            if (!document.getElementById('consent').checked) {
                document.getElementById('consentError').classList.remove('hidden');
                valid = false;
            }

            return valid;
        }

        function submitForm() {
            if (validateForm()) {
                // Show success
                document.getElementById('successMessage').classList.remove('hidden');
                document.getElementById('formContainer').classList.add('opacity-50', 'pointer-events-none');

                // Reset form after 4 seconds
                setTimeout(() => {
                    document.getElementById('userForm').reset();
                    document.getElementById('successMessage').classList.add('hidden');
                    document.getElementById('formContainer').classList.remove('opacity-50', 'pointer-events-none');
                    
                }, 4000);
            }
        }
    </script>
</body>
</html>
